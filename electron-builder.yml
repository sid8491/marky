appId: com.marky.app
productName: Marky
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: Marky
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.productivity
  # Code signing and notarization disabled until credentials are available.
  # Users will see Gatekeeper warnings on first launch; see README for the bypass.
  identity: null
  notarize: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
linux:
  target:
    - AppImage
  category: Office
  maintainer: marky
publish:
  provider: github
  releaseType: release
