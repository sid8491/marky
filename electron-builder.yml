appId: com.marky.app
productName: Marky
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,CONTRIBUTING.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{eslint.config.mjs,.prettierrc.json,.prettierignore,.gitattributes}'
  - '!marky.png'
  - '!build/**'
  - '!docs/**'
asarUnpack:
  - resources/**
# Register Marky as an "Open With" handler for markdown files on all
# platforms. macOS gets the entries in Info.plist (LSItemContentTypes);
# Windows NSIS writes registry keys via the installer; Linux .desktop
# files declare MimeType associations.
fileAssociations:
  - ext: md
    name: Markdown
    description: Markdown document
    role: Editor
    rank: Alternate
  - ext: markdown
    name: Markdown
    description: Markdown document
    role: Editor
    rank: Alternate
  - ext: mdx
    name: MDX
    description: MDX document
    role: Editor
    rank: Alternate
win:
  executableName: Marky
  icon: build/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.productivity
  icon: build/icons/icon.icns
  # Code signing and notarization disabled until credentials are available.
  # Users will see Gatekeeper warnings on first launch; see README for the bypass.
  identity: null
  notarize: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
linux:
  icon: build/icons
  target:
    - AppImage
  category: Office
  maintainer: marky
publish:
  provider: github
  releaseType: release
